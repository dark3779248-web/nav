    --shadow: 0 1px 0 rgba(0,0,0,0.02), 0 2px 4px -2px rgba(60,40,20,0.06);

    --radius: 4px;
  }
  [data-theme="dark"] {
    --bg: #15130f;
    --bg-2: #1d1a14;
    --ink: #f2ebde;
    --ink-2: #b5ad9e;
    --ink-3: #77706a;
    --line: #2a251e;
    --line-2: #3a3327;
    --accent: #e85f42;
    --accent-2: #f0925a;
    --accent-soft: #2e1a13;
    --gold: #d4b36a;
    --card: #1d1a14;
    --card-hover: #26211a;
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 2px 4px -2px rgba(0,0,0,0.3);

    line-height: 1.5;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }
  /* 顶部栏 */
  .topbar {
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 28px;

  .logo {

    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    color: #fff;
    display: inline-grid;
    place-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    transform: rotate(-4deg);
  }
  .logo-sub {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;

    text-transform: uppercase;
    border-left: 1px solid var(--line-2);
    padding-left: 12px;
  }
  /* 搜索 */
  .search-wrap {
    flex: 1;
    max-width: 640px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within {
    border-color: var(--accent);
  }
  .engine-select {
    display: flex;
    background: var(--bg-2);
    border-right: 1px solid var(--line);
  }
  .engine-btn {
    padding: 9px 12px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .engine-btn.active {
    color: var(--accent);
    background: var(--accent-soft);
  }
  .search-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }
  .search-input::placeholder { color: var(--ink-3); }
  .search-btn {
    padding: 10px 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  .search-btn:hover { background: var(--accent-2); }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    border-radius: var(--radius);
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-2);
    transition: all 0.15s;
    font-size: 16px;
  }
  .icon-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* 主体 */
  .layout {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 24px;
  }
  /* 侧边栏 */
  .sidebar {
    position: sticky;
    top: 80px;
    align-self: start;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 8px 0;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  .side-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    text-transform: uppercase;
    padding: 10px 16px 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .side-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    color: var(--ink-2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;

  .side-link:hover {
    background: var(--bg);
    color: var(--ink);
  }
  .side-link.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--accent-soft);
  }
  .side-link .emoji {
    font-size: 15px;
    width: 20px;
    text-align: center;
  }
  .side-divider {
    height: 1px;
    background: var(--line);
    margin: 8px 16px;
  }

  /* 主内容区 */
  .main { min-width: 0; }
  /* 常用收藏横幅 */
  .favs {
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .favs-label {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 14px;
    border-right: 1px solid var(--line-2);
  }

    gap: 6px;
    flex-wrap: wrap;
    flex: 1;

  .fav-chip {

    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: var(--bg-2);
    color: var(--ink);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--line);
    transition: all 0.15s;

    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .favs-empty {
    color: var(--ink-3);
    font-size: 12.5px;
    font-style: italic;
  }

    height: 32px;

    place-items: center;
    font-weight: 800;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: #fff;
    letter-spacing: -0.02em;
    border-radius: 2px;

  .site-text { min-width: 0; flex: 1; }
  .site-name {
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .site-desc {
    font-size: 11px;
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

    position: absolute;
    top: 6px;
    right: 6px;
    width: 18px; height: 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    opacity: 0;
    transition: all 0.15s;
    font-size: 13px;
    line-height: 1;
  }
  .site:hover .star-btn { opacity: 0.6; }
  .star-btn:hover { opacity: 1 !important; color: var(--accent); transform: scale(1.2); }
  .star-btn.starred { opacity: 1; color: var(--accent); }

  /* 页脚 */
  .footer {
    text-align: center;
    padding: 30px 20px 20px;
    color: var(--ink-3);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
  }
  .footer hr {
    border: none;
    border-top: 1px dashed var(--line-2);
    max-width: 200px;
    margin: 0 auto 16px;
  }

  /* 响应式 */
  @media (max-width: 1100px) {
    .cat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    .sidebar {
      position: static;
      max-height: none;
      display: flex;
      overflow-x: auto;
      padding: 6px;
      gap: 2px;
    }
    .side-title, .side-divider { display: none; }
    .side-link {
      border-left: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      padding: 6px 12px;
    }
    .side-link.active { border-bottom-color: var(--accent); border-left-color: transparent; }
    .topbar-inner { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
    .logo-sub { display: none; }
    .search-wrap { order: 3; flex-basis: 100%; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 500px) {
    .cat-grid { grid-template-columns: 1fr; }
  }
  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

const SEARCH_ENGINES = [
  { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
  { id: "baidu", name: "百度", url: "https://www.baidu.com/s?wd=" },
  { id: "bing", name: "必应", url: "https://www.bing.com/search?q=" },
];

/* ========== 状态 ========== */
const LS = {
  THEME: "nav_theme",
  ENGINE: "nav_engine",
  FAVS: "nav_favs",
};
let currentEngine = localStorage.getItem(LS.ENGINE) || "google";
let favs = new Set(JSON.parse(localStorage.getItem(LS.FAVS) || "[]"));

/* ========== 渲染 ========== */
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = '<div class="side-title">分类导航</div>';
  CATEGORIES.forEach((c, i) => {
    html += `<a class="side-link" data-cat="${c.id}" href="#cat-${c.id}">
      <span class="emoji">${c.emoji}</span>
      <span>${c.name}</span>
    </a>`;
  });
  html += '<div class="side-divider"></div><div class="side-title">快捷</div>';
  html += '<a class="side-link" href="#top"><span class="emoji">⬆️</span><span>回到顶部</span></a>';
  sb.innerHTML = html;
}

function siteHTML(site, catId) {
  const key = catId + "|" + site.u;
  const starred = favs.has(key);
  const initial = site.n.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, "").slice(0, 1) || site.n.slice(0, 1);
  return `<a class="site" href="${site.u}" target="_blank" rel="noopener" data-key="${key}" data-name="${site.n}" data-url="${site.u}" data-cat="${catId}">
    <span class="site-icon" style="background:${site.c}">${initial}</span>
    <span class="site-text">
      <span class="site-name">${site.n}</span>
      <span class="site-desc">${site.d}</span>
    </span>
    <button class="star-btn ${starred ? 'starred' : ''}" data-star="${key}" title="收藏" aria-label="收藏">${starred ? '★' : '☆'}</button>
  </a>`;
}

function renderCategories() {
  const c = document.getElementById("catContainer");
  let html = "";
  CATEGORIES.forEach(cat => {
    html += `<section class="category" id="cat-${cat.id}">
      <div class="cat-head">
        <h2 class="cat-title">
          <span class="emoji">${cat.emoji}</span>
          <span>${cat.name}</span>
          <span class="num">· ${String(cat.sites.length).padStart(2, "0")} 站</span>
        </h2>
        <span class="cat-accent">— ${cat.accent}</span>
      </div>
      <div class="cat-grid">
        ${cat.sites.map(s => siteHTML(s, cat.id)).join("")}
      </div>
    </section>`;
  });
  c.innerHTML = html;
}

function renderFavs() {
  const f = document.getElementById("favsList");
  const items = [];
  CATEGORIES.forEach(cat => {
    cat.sites.forEach(s => {
      const key = cat.id + "|" + s.u;
      if (favs.has(key)) items.push({ site: s, cat: cat.id });
    });
  });
  if (items.length === 0) {
    f.innerHTML = '<span class="favs-empty">点击网址卡片右上角的 ☆ 收藏到这里 →</span>';
  } else {
    f.innerHTML = items.map(x =>
      `<a class="fav-chip" href="${x.site.u}" target="_blank" rel="noopener">
        <span style="display:inline-block;width:6px;height:6px;background:${x.site.c};border-radius:50%"></span>
        ${x.site.n}
      </a>`
    ).join("");
  }
}

function renderEngines() {
  const el = document.getElementById("engines");
  el.innerHTML = SEARCH_ENGINES.map(e =>
    `<button class="engine-btn ${currentEngine === e.id ? 'active' : ''}" data-engine="${e.id}">${e.name}</button>`
  ).join("");
}

/* ========== 交互 ========== */
function initTheme() {
  const saved = localStorage.getItem(LS.THEME);
  const prefers = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = saved || (prefers ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS.THEME, next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
}

function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  const engine = SEARCH_ENGINES.find(e => e.id === currentEngine);
  window.open(engine.url + encodeURIComponent(q), "_blank", "noopener");
}

function toggleFav(key) {
  if (favs.has(key)) favs.delete(key); else favs.add(key);
  localStorage.setItem(LS.FAVS, JSON.stringify([...favs]));
  // 更新按钮
  document.querySelectorAll(`[data-star="${CSS.escape(key)}"]`).forEach(btn => {
    const s = favs.has(key);
    btn.classList.toggle("starred", s);
    btn.textContent = s ? "★" : "☆";
  });
  renderFavs();
}

function setActiveSidebar(catId) {
  document.querySelectorAll(".side-link").forEach(l => {
    l.classList.toggle("active", l.dataset.cat === catId);
  });
}

/* ========== 事件绑定 ========== */
function bindEvents() {
  // 搜索引擎切换
  document.getElementById("engines").addEventListener("click", e => {
    const btn = e.target.closest("[data-engine]");
    if (!btn) return;
    currentEngine = btn.dataset.engine;
    localStorage.setItem(LS.ENGINE, currentEngine);
    renderEngines();
  });
  // 搜索
  document.getElementById("searchBtn").addEventListener("click", doSearch);
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });
  // 主题
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
  // 收藏
  document.getElementById("catContainer").addEventListener("click", e => {
    const star = e.target.closest("[data-star]");
    if (star) {
      e.preventDefault();
      e.stopPropagation();
      toggleFav(star.dataset.star);
    }
  });
  // 侧边栏高亮（滚动监听）
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const id = en.target.id.replace("cat-", "");
        setActiveSidebar(id);
      }
    });
  }, { rootMargin: "-40% 0px -50% 0px" });
  document.querySelectorAll(".category").forEach(c => io.observe(c));
}

/* ========== 启动 ========== */
initTheme();
renderEngines();
renderSidebar();
renderCategories();
renderFavs();
bindEvents();
</script>
